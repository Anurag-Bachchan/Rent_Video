spring.application.name=rent-video

# MySQL connection - change username/password to match your setup
spring.datasource.url=jdbc:mysql://localhost:3306/rent_video?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
